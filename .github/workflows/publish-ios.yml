name: Publish iOS Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-xcframework:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build XCFramework
        run: |
          cd platform/ios

          # Build for iOS device
          xcodebuild archive \
            -scheme MuybridgePlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MuybridgePlayer-iOS.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

          # Build for iOS Simulator
          xcodebuild archive \
            -scheme MuybridgePlayer \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/MuybridgePlayer-Simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

          # Create XCFramework
          xcodebuild -create-xcframework \
            -framework build/MuybridgePlayer-iOS.xcarchive/Products/Library/Frameworks/MuybridgePlayer.framework \
            -framework build/MuybridgePlayer-Simulator.xcarchive/Products/Library/Frameworks/MuybridgePlayer.framework \
            -output MuybridgePlayerBinary.xcframework

      - name: Zip XCFramework
        run: |
          cd platform/ios
          zip -r MuybridgePlayerBinary.xcframework.zip MuybridgePlayerBinary.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: MuybridgePlayerBinary-xcframework
          path: platform/ios/MuybridgePlayerBinary.xcframework.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: platform/ios/MuybridgePlayerBinary.xcframework.zip
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
