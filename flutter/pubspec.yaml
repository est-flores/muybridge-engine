name: muybridge_flutter
description: Flutter plugin for Muybridge hardware-accelerated video playback.
version: 0.1.0
homepage: https://github.com/formula-systems-org/muybridge-engine

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MuybridgeFlutterPlugin
        swift: true
      android:
        pluginClass: MuybridgeFlutterPlugin
        package: com.muybridge.flutter

dependencies:
  flutter:
    sdk: flutter
